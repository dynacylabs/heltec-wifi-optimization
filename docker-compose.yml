services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hobocams
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: hobocams
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - internal

  app:
    build: ./app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://hobocams:changeme@timescaledb:5432/hobocams
      OPTIMIZER_INTERVAL_SECONDS: "300"
      API_TOKEN: changeme
    depends_on:
      - timescaledb
    ports:
      - "8080:8080"
    networks:
      - internal

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: changeme
      POSTGRES_DB: hobocams
      POSTGRES_USER: hobocams
      POSTGRES_PASSWORD: changeme
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - timescaledb
    ports:
      - "3000:3000"
    networks:
      - internal

networks:
  internal:

volumes:
  timescale_data:
  grafana_data:
