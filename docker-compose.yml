services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hobocams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a password in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hobocams}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build: ./app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hobocams}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-hobocams}
      OPTIMIZER_INTERVAL_SECONDS: ${OPTIMIZER_INTERVAL_SECONDS:-300}
    depends_on:
      - timescaledb
    ports:
      - "8080:8080"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set a password in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hobocams}
      POSTGRES_USER: ${POSTGRES_USER:-hobocams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a password in .env}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - timescaledb
    ports:
      - "3000:3000"

volumes:
  timescale_data:
  grafana_data:
