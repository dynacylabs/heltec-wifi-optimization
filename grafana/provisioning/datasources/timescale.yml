apiVersion: 1
datasources:
  - name: HoboCams TimescaleDB
    uid: hobocams-timescale
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: $POSTGRES_DB
    user: $POSTGRES_USER
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    isDefault: true
